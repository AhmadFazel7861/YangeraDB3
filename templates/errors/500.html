{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خطای سرور — ۵۰۰</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.rtl.min.css' %}">
  <link rel="stylesheet" href="{% static 'icons/bootstrap-icons.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script>
    (function() {
      const t = localStorage.getItem('erp_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;
            justify-content:center;background:var(--bg-primary);">
  <div style="text-align:center;padding:40px 20px;max-width:480px;">

    <div style="font-size:96px;font-weight:900;color:var(--accent-red);
                opacity:.15;line-height:1;margin-bottom:16px;">
      ۵۰۰
    </div>

    <div style="width:80px;height:80px;border-radius:20px;
                background:rgba(239,68,68,.1);color:var(--accent-red);
                display:flex;align-items:center;justify-content:center;
                font-size:36px;margin:0 auto 24px;">
      <i class="bi bi-exclamation-octagon"></i>
    </div>

    <h1 style="font-size:22px;font-weight:800;
               color:var(--text-primary);margin-bottom:12px;">
      خطای داخلی سرور
    </h1>

    <p style="font-size:14px;color:var(--text-muted);margin-bottom:32px;">
      متأسفانه خطایی در سیستم رخ داده است.
      لطفاً صفحه را دوباره بارگذاری کنید یا با مدیر سیستم تماس بگیرید.
    </p>

    <div class="d-flex gap-3 justify-content-center">
      <a href="/dashboard/"
         style="background:var(--accent-blue);color:white;
                padding:12px 24px;border-radius:10px;
                text-decoration:none;font-size:14px;font-weight:600;
                display:inline-flex;align-items:center;gap:8px;">
        <i class="bi bi-house"></i>
        بازگشت به داشبورد
      </a>
      <a href="javascript:location.reload()"
         style="background:var(--bg-tertiary);color:var(--text-secondary);
                padding:12px 24px;border-radius:10px;
                text-decoration:none;font-size:14px;font-weight:600;
                display:inline-flex;align-items:center;gap:8px;
                border:1px solid var(--border-color);">
        <i class="bi bi-arrow-clockwise"></i>
        تلاش مجدد
      </a>
    </div>

  </div>
</div>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
