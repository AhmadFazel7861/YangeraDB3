{% if messages %}
<div class="px-4 pt-3" style="padding-bottom:0;">
  {% for message in messages %}
    <div class="erp-alert erp-alert-{{ message.tags }}" data-auto-dismiss="4000">
      <i class="bi bi-{% if message.tags == 'success' %}check-circle-fill{% elif message.tags == 'danger' %}x-circle-fill{% elif message.tags == 'warning' %}exclamation-triangle-fill{% else %}info-circle-fill{% endif %}"></i>
      {{ message }}
      <button class="close-btn ms-auto" style="background:none;border:none;cursor:pointer;color:inherit;font-size:16px;">
        <i class="bi bi-x"></i>
      </button>
    </div>
  {% endfor %}
</div>
{% endif %}
